# =============================================================================
# deepseek-harness config layer → ชี้ stack เดิมของเรา (Tiel/LiteLLM + MCP tools)
# -----------------------------------------------------------------------------
# วางไฟล์นี้ที่ $DSH_HOME/profiles/web/cordis.patch.yml (deploy.sh ทำให้)
# cordis.patch เป็น "list ของ config patch ต่อ plugin": provider = plugin นึง, MCP = อีก plugin
#
# ✅ CONFIRMED (จาก docs/user/guide/providers.md ของ deepseek-harness):
#    รูปแบบ provider custom OpenAI-compatible ด้านล่าง (baseURL/api/apiKeyEnv/models/compat)
# ⚠️ NEEDS-VERIFY: โครง key ของบล็อก MCP (อิงเอกสาร dsh-mcp-client — เช็กเป๊ะอีกที)
# =============================================================================

# ── (1) model provider → LiteLLM gateway บน host:4000 (Tiel / vision / nim) ──
- id: llm-litellm-local
  config:
    providers:
      litellm-local:
        apiKeyEnv: LITELLM_KEY              # ตั้ง env LITELLM_KEY=sk-local (llama ไม่เช็ค แต่ field ต้องมี)
        api: openai-completions
        baseURL: http://localhost:4000/v1   # = LiteLLM ที่ publish ออก host (127.0.0.1:4000)
        models:
          - id: cybermodel                  # Tiel (orchestrator) — งาน sensitive/หลักฐาน
          - id: vision                       # Qwen2.5-VL (อ่านภาพ)
          - id: nim                           # GLM cloud — ⚠️ งาน non-sensitive เท่านั้น
        compat:
          supportsDeveloperRole: false       # llama.cpp มักต้องตั้ง (ถ้า request โดนปฏิเสธทั้งที่ url/key ถูก)
          maxTokensField: max_tokens

# ── (2) MCP tools → HexStrike router + REA ──────────────────────────────────
#   ✅ โครงถูกต้องจาก README ของ @deepseek-ai/dsh-mcp-client:
#      "1 entry ต่อ 1 server" — แต่ละ entry มี id (unique), name (= plugin), config (flat)
#      ไม่ใช่ servers: map (อันเดิมผมเดาผิด). tool โผล่แบบ mcp__<serverName>__<toolName>
#   ⚠️ url ต้องเป็น localhost (harness รันบน host) ไม่ใช่ชื่อ service ภายใน docker
- id: mcp-hexstrike
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: hexstrike                    # → tool: mcp__hexstrike__* (search/describe/run)
    transport: streamable-http
    url: http://localhost:8001/mcp
    failOnStartupError: false                # ต่อไม่ติด = harness ยังขึ้น แต่ไม่มี tool (ดู log)

- id: mcp-rea
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: rea                          # → tool: mcp__rea__* (ต้องเปิด --profile full)
    transport: streamable-http
    url: http://localhost:8007/mcp
    failOnStartupError: false
#   หมายเหตุ: vision/specialist เราเรียกผ่าน bash heredoc → localhost:4000 (ไม่ใช่ MCP)
#   deepseek-harness มี bash/command tool อยู่แล้ว → เรียกแบบเดิมได้ ไม่ต้องลง MCP
