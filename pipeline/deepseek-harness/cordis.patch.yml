# =============================================================================
# deepseek-harness config layer — AUTO-SYNCED BY n8n BACKEND BRIDGE
# =============================================================================

- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      litellm-local:
        displayName: LiteLLM (local)
        apiKeyEnv: LITELLM_KEY
        api: openai-completions
        baseURL: http://litellm:4000/v1
        models:
          - id: orchestrator
            name: "Inkling-2-Mini-abliterated-Mix-12G (:8090)"
            input: [text, image]
          - id: cyber-model
            name: "Cyber-Model (Cyber Security)"
            input: [text, image]
          - id: vision
            name: "Vision (Qwen2.5-VL)"
            input: [text, image]
          - id: nim
            name: "NVIDIA NIM (Nemotron VL 120B Cloud)"
            input: [text, image]
          - id: or-nemo
            name: "OpenRouter (GLM-5.3 Cloud)"
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens

- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: litellm-local
    model: cybermodel

