# =============================================================================
# deepseek-harness config layer → ชี้ stack เดิมของเรา (Tiel/LiteLLM + MCP tools)
# -----------------------------------------------------------------------------
# ‼️ เวอร์ชันนี้สำหรับ "รันใน container" (service deepseek-harness ใน docker-compose)
#    harness อยู่ใน network เดียวกับ stack → ใช้ "ชื่อ service" ตรง ๆ:
#       litellm:4000 · hexstrike-mcp:8001 · rea-mcp:8007   (ไม่ใช่ localhost อีกแล้ว)
#    (ตอนรันบน host เท่านั้นที่ต้องใช้ localhost — ตอนนี้เราย้ายเข้า container แล้ว)
#
# mount ไฟล์นี้เข้า container ที่ /dsh/profiles/web/cordis.patch.yml (ดู docker-compose.yml)
# cordis.patch = "list ของ patch ต่อ plugin" แต่ละ entry ต้องมี: id + name(plugin) + config
#   ⚠️ มัน"แก้ entry ที่มีอยู่" (patch by id) — provider ใช้ id `llm-pi-ai` ที่มีอยู่แล้ว
#   ⚠️ MCP: plugin dsh-mcp-client ถูกติดตั้งตอน build image แล้ว (ดู Dockerfile.deepseek-harness)
# =============================================================================

# ── (1) model provider → LiteLLM ใน network (service: litellm:4000) ──────────
#   patch เข้า entry `llm-pi-ai` (provider plugin ที่มีอยู่) แล้วเติม provider ของเรา
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"         # ← plugin ของ LLM provider (custom OpenAI-compatible)
  config:
    providers:
      litellm-local:
        displayName: LiteLLM (local)
        apiKeyEnv: LITELLM_KEY              # compose ส่ง LITELLM_KEY=sk-local เข้า container
        api: openai-completions
        baseURL: http://litellm:4000/v1     # ชื่อ service ใน docker network (ไม่ใช่ localhost)
        models:
          - id: cybermodel                  # Tiel (orchestrator) — งาน sensitive/หลักฐาน
            name: Cyber-Tiel
          - id: vision                       # Qwen2.5-VL (อ่านภาพ)
            name: Vision (Qwen2.5-VL)
          - id: nim                          # GLM cloud — ⚠️ งาน non-sensitive เท่านั้น
            name: NIM (GLM cloud)
        compat:
          supportsDeveloperRole: false       # llama.cpp มักต้องตั้ง (ถ้า request โดนปฏิเสธทั้งที่ url/key ถูก)
          maxTokensField: max_tokens

# ── (1b) ตั้ง provider/model ดีฟอลต์ของ agent = Tiel (cybermodel) ──────────────
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: litellm-local                  # ต้องตรงกับ key ใน providers: ด้านบน
    model: cybermodel

# ── (2) MCP tools → HexStrike router + REA (service names ใน network) ────────
#   plugin dsh-mcp-client ลงตอน build แล้ว → entry พวกนี้ instantiate ได้
#   รูปแบบ: 1 entry ต่อ 1 server · tool โผล่แบบ mcp__<serverName>__<toolName>
#   required: serverName, transport, url, headers, toolCallTimeoutMs, failOnStartupError
- id: mcp-hexstrike
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: hexstrike                    # → tool: mcp__hexstrike__* (search/describe/run)
    transport: streamable-http
    url: http://hexstrike-mcp:8001/mcp       # service: hexstrike-mcp (MCP_PORT 8001)
    headers: {}                              # required (ไม่มี auth สำหรับภายใน network → ว่าง)
    toolCallTimeoutMs: 300000                # required — timeout ต่อ 1 tool call (scan นานได้ 5 นาที)
    failOnStartupError: false                # ต่อไม่ติด = harness ยังขึ้น แต่ไม่มี tool (ดู log)

- id: mcp-rea
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: rea                          # → tool: mcp__rea__* (service rea-mcp ต้องเปิด profile full)
    transport: streamable-http
    url: http://rea-mcp:8007/mcp             # service: rea-mcp
    headers: {}                              # required
    toolCallTimeoutMs: 300000                # required — RE/decompile ใช้เวลานาน → 5 นาที
    failOnStartupError: false
#   หมายเหตุ: งานวิเคราะห์ที่แตะ "ตัวอย่างมัลแวร์" ให้ไปทาง MCP (→ container hexstrike/rea)
#   ที่แยกขาด เท่านั้น — ไม่ใช่ bash ในตัว harness เอง (กฎ: analyze local ใน container)
