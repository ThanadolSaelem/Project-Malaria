# =============================================================================
# Override สำหรับ Mac (Apple Silicon / arm64) — "ปุ่มเดียวใน Docker"
# -----------------------------------------------------------------------------
# ใช้คู่กับ docker-compose.yml + เปิด profile "full" (เพื่อให้ hexstrike-server ขึ้น):
#
#     docker compose -f docker-compose.yml -f docker-compose.mac.yml \
#                    --profile full up -d --build
#
# (หรือใช้ pipeline/mac/start.command คลิกเดียวจบ — ใส่ flag พวกนี้ให้แล้ว)
#
# override นี้ทำ 2 อย่าง:
#   1) เปลี่ยน build ของ hexstrike-server ไปใช้ Dockerfile.hexstrike-server.arm64
#      → รัน NATIVE arm64 ไม่ใช่ emulation (image Kali เดิมเป็น amd64)
#   2) ชี้ hexstrike-mcp ให้ต่อ hexstrike-server "ภายใน compose network" แทน
#      host.docker.internal → ไม่ต้องรัน server native แยกอีก
#
# ทำไมยังต้องมี `--profile full`: hexstrike-server ใน docker-compose.yml ถูกตั้ง
# profiles:["full"] ไว้ (กัน Linux/Kali ที่รัน server native อยู่แล้วไม่ต้อง build
# image หนักโดยไม่ตั้งใจ) การ override เป็น profiles:[] "ไม่" ปลดล็อก เพราะ compose
# มองข้าม empty-list ตอน merge → จึงเปิด profile ตรงๆ แทน (เชื่อถือได้กว่า)
#
# สิ่งเดียวที่ยังต้องรัน native นอก Docker คือ "โมเดล" (llama.cpp) เพราะ
# Docker Desktop Mac ไม่ส่ง GPU (Metal) เข้า container — llama.cpp อยู่บน host
# :8090 แล้ว litellm วิ่งออกมาหาผ่าน host.docker.internal (ตั้งใน litellm-config)
# =============================================================================
services:

  hexstrike-server:
    build:
      context: ..
      dockerfile: pipeline/Dockerfile.hexstrike-server.arm64
      args:
        INSTALL_SECLISTS: "true"       # "false" = ไม่ลง SecLists (image เล็กลง ~1GB)
    platform: linux/arm64              # บังคับ arm64 แท้ (กัน pull ตัว amd64 มา emulate)

  hexstrike-mcp:
    # ใช้ tool-RAG router แทน wrapper เต็ม: expose แค่ 3 meta-tools
    # (search / describe / run) → ประหยัด context ~95% แต่เข้าถึงครบ 150 tool
    # endpoint เดิม /mcp:8001 ไม่เปลี่ยน — OpenCode แค่ refresh ก็เห็น 3 tool
    command: ["python", "/app/pipeline/hexstrike_mcp_router.py"]
    environment:
      # ต่อ server ที่อยู่ใน compose network เดียวกัน (ชื่อ service = DNS ภายใน)
      HEXSTRIKE_SERVER: http://hexstrike-server:8888
