# =============================================================================
# LiteLLM — LOCAL-FIRST (Mac / Apple Silicon)
# -----------------------------------------------------------------------------
# harness (ผ่าน HarnessRouter) ยิงชื่อโมเดลมา → LiteLLM ส่งต่อไป llama.cpp ที่รัน
# native บน host :8090 (เสิร์ฟโมเดลชื่อ "cybermodel" — ยืนยันจาก /v1/models)
#
# สำคัญ: "ชื่อ 3 ชั้นต้องตรงกัน"
#   1) ชื่อที่ integration ใน HarnessRouter ส่งออกมา (model_id)  ← OpenCode ส่ง "cybermodel"
#   2) model_name ในไฟล์นี้ (ต้องมีชื่อนั้น ไม่งั้น LiteLLM หาไม่เจอแล้วเดาไป OpenAI
#      → error "Invalid model name ... for your key")
#   3) ชื่อโมเดลที่ llama.cpp เสิร์ฟจริง = target `model: openai/<ชื่อ>` ← "cybermodel"
#
# เผื่อไว้ให้ทุกชื่อที่เคยตั้ง (cybermodel / big-brain / local-cybertiel) ชี้ llama
# ตัวเดียวกันหมด จะเลือกชื่อไหนใน integration ก็ติด
# =============================================================================

model_list:
  # ---- llama.cpp local (host :8090, เสิร์ฟ "cybermodel") — ทุก alias ชี้ที่เดียว ----
  - model_name: cybermodel
    litellm_params:
      model: openai/cybermodel            # ต้องตรงกับ id ใน curl :8090/v1/models
      api_base: http://host.docker.internal:8090/v1
      api_key: "sk-local"                 # llama รัน loopback ไม่เช็ค key แต่ต้องมีค่า

  - model_name: big-brain
    litellm_params:
      model: openai/cybermodel
      api_base: http://host.docker.internal:8090/v1
      api_key: "sk-local"

  - model_name: local-cybertiel           # เผื่อ integration เก่าที่ตั้งชื่อนี้
    litellm_params:
      model: openai/cybermodel
      api_base: http://host.docker.internal:8090/v1
      api_key: "sk-local"

  # ---- (ออปชัน) cloud fallback — ต้องใส่ key ใน .env ก่อนถึงใช้ได้ ----
  # เปิดใช้: เอา comment ออก + ใส่ชื่อใน router_settings.fallbacks
  # - model_name: big-brain-groq
  #   litellm_params:
  #     model: groq/openai/gpt-oss-120b
  #     api_key: os.environ/GROQ_API_KEY

general_settings:
  # litellm (main-stable) เวอร์ชันใหม่ปฏิเสธ boot ถ้าไม่มี master key
  # pipeline นี้ litellm bind 127.0.0.1 + อยู่ใน compose network ภายในเท่านั้น
  # (ไม่เปิดออกนอกเครื่อง) จึงอนุญาตให้ไม่มี master key ได้สำหรับ local
  # ⚠️ ถ้าจะเปิด litellm ให้เครื่อง/คนอื่นเข้าถึง → ลบบรรทัดนี้ แล้วตั้ง
  #    LITELLM_MASTER_KEY=sk-... ใน .env + ให้ caller ส่ง key นั้นมาแทน
  dangerously_permit_weak_or_unset_master_key: true

litellm_settings:
  drop_params: true                        # ตัด param ที่ปลายทางไม่รองรับทิ้ง แทน error

router_settings:
  timeout: 600                             # โมเดล local ตอบช้ากว่าคลาวด์ ให้เวลาเยอะ
  num_retries: 2
  # NIM/Groq ล่ม → fallback (เปิดเมื่อ uncomment entry ด้านบน + ใส่ key)
  # fallbacks:
  #   - big-brain: ["big-brain-groq"]
