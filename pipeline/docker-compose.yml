# =============================================================================
# Pipeline เดียว: HarnessRouter + HexStrike MCP + LiteLLM
# -----------------------------------------------------------------------------
#   app → HarnessRouter (เลือก/รัน harness) ─┬─ โมเดล → LiteLLM → NIM/Groq/Cerebras
#                                            └─ เครื่องมือ → HexStrike MCP → tools
#
#   วิธีใช้:
#     1) cp .env.example .env   แล้วใส่ key จริง
#     2) รัน hexstrike_server.py บนเครื่อง Kali/Parrot (ดู README ข้อ 3)
#     3) docker compose up -d
#     4) เปิด http://localhost:3000 ลงทะเบียน HexStrike MCP (README ข้อ 5)
# =============================================================================
services:

  # ── ชั้นสลับ provider (กัน timeout/delay) ────────────────────────────────
  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    environment:
      NVIDIA_API_KEY: ${NVIDIA_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      CEREBRAS_API_KEY: ${CEREBRAS_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ── ชั้นเครื่องมือ: server ที่รันเครื่องมือจริง (opt-in ผ่าน profile "full") ──
  # ไม่รันโดยดีฟอลต์เพราะ image หนัก ถ้าคุณรัน hexstrike_server.py แยกบน Kali อยู่
  # แล้ว ข้ามตัวนี้ไปได้เลย แล้วตั้ง HEXSTRIKE_SERVER ให้ชี้ไปเครื่องนั้น
  # เปิดด้วย:  docker compose --profile full up -d --build
  hexstrike-server:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: pipeline/Dockerfile.hexstrike-server
    volumes:
      - ../hexstrike-ai-main:/app/hexstrike-ai-main:ro
      # วางไฟล์ handshake ที่จับมา (.cap/.pcap/.hccapx) ไว้ใน pipeline/captures/
      # แล้ว aircrack-ng/hashcat ในคอนเทนเนอร์อ่านได้ที่ /captures (เขียนผลกลับได้)
      - ./captures:/captures
      # รูปหลักฐานสำหรับรายงาน TLP: Tiel เซฟรูป (render โค้ด/ผลเครื่องมือ) ลง pipeline/evidence/
      # → เห็นที่ /evidence แล้ว assemble.py หยิบไปใส่ในรายงาน (ดู pipeline/reporting/)
      - ./evidence:/evidence
      # ประกอบรายงานอัตโนมัติในคอนเทนเนอร์: โค้ด reporting (read-only) + โฟลเดอร์ output
      # Tiel เขียน /reports/<ชื่อ>.json แล้วสั่ง python3 /reporting/assemble.py เอง→ ได้ .docx ที่ /reports
      - ./reporting:/reporting:ro
      - ./reports:/reports
    environment:
      HEXSTRIKE_PORT: 8888
    # nmap -sS / masscan ต้องใช้ raw socket → ให้ capability นี้กับ container
    cap_add:
      - NET_RAW
      - NET_ADMIN
    # เครื่องมือ (httpx/nmap/nuclei/...) รันในนี้ ต้องยิง lab target บน host ได้ด้วย
    # (host.docker.internal:18056). บน Mac Docker Desktop resolve ให้เอง แต่ "บน Linux
    # ต้อง map ชัด" ไม่งั้นยิง lab ไม่โดน → ใส่ให้ reproduce ได้ทั้ง Mac/Linux
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8888:8888"
    restart: unless-stopped

  # ── ชั้นเครื่องมือ (MCP over HTTP) ───────────────────────────────────────
  # ต่อไปยัง hexstrike_server.py (ตัวจริงที่รันเครื่องมือ) ที่ HEXSTRIKE_SERVER
  hexstrike-mcp:
    build:
      context: ..
      dockerfile: pipeline/Dockerfile.hexstrike-mcp
    volumes:
      - ../hexstrike-ai-main:/app/hexstrike-ai-main:ro
      - ./hexstrike_mcp_http.py:/app/pipeline/hexstrike_mcp_http.py:ro
      - ./hexstrike_mcp_router.py:/app/pipeline/hexstrike_mcp_router.py:ro   # tool-RAG (ใช้ผ่าน command override)
      # php2shell toolkit (CVE-2026-109618/109619) — router import แล้ว register
      # เข้า catalog → Tiel เรียกผ่าน hexstrike_run("php2shell_*"). mount ให้แก้สดได้
      # (image ก็ COPY ไว้แล้ว ดู Dockerfile.hexstrike-mcp — mount แค่ทับให้ iterate ง่าย)
      - ./php2shell_tools.py:/app/pipeline/php2shell_tools.py:ro
      - ./php2shell-poc:/app/pipeline/php2shell-poc:ro
      # shot: tool proxy (browser อยู่ service แยก) — mount ให้แก้สดได้
      - ./shot_tools.py:/app/pipeline/shot_tools.py:ro
      - ./vflat_tools.py:/app/pipeline/vflat_tools.py:ro
      - ./report_tools.py:/app/pipeline/report_tools.py:ro
      - ./node-config.json:/app/pipeline/node-config.json:ro
      - ./reporting:/reporting:ro
      - ./reports:/reports
      - ./evidence:/evidence
    environment:
      HEXSTRIKE_SERVER: ${HEXSTRIKE_SERVER:-http://host.docker.internal:8888}
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8001
      PHP2SHELL_TARGET: http://host.docker.internal:18056   # lab target บน host Mac
      SHOT_URL: http://shot:9000                            # web_screenshot → shot service
    ports:
      - "127.0.0.1:8001:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"   # ให้ container เห็น service บน host (Linux)
    restart: unless-stopped

  # ── ชั้นความจำ (knowledge-graph memory, MCP over HTTP) ───────────────────
  # ให้โมเดลจำข้ามรอบ/ข้าม session — เก็บ entities+observations+relations ลง JSON
  # บน volume (ไม่มี embedding/vector → ไม่มีปัญหา dimension ตอนเปลี่ยนโมเดล)
  # reuse image เดียวกับ hexstrike-mcp (มี mcp SDK อยู่แล้ว) แค่เปลี่ยน command
  memory-mcp:
    build:
      context: ..
      dockerfile: pipeline/Dockerfile.hexstrike-mcp
    command: ["python", "/app/pipeline/memory_mcp_http.py"]
    volumes:
      - ./memory_mcp_http.py:/app/pipeline/memory_mcp_http.py:ro
      - memory-data:/data
    environment:
      MEMORY_FILE: /data/memory.json
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8002
    ports:
      - "127.0.0.1:8002:8002"
    restart: unless-stopped

  # ── สะพานผู้เชี่ยวชาญแบบ stateless (MCP over HTTP) ─────────────────────────
  # ask_exploit_specialist เป็นคำขอ single-turn ไปยัง local Cyber-Model (:8091).
  # ask_coding_orchestrator ปิดไว้โดยดีฟอลต์ เพราะ Qwen Code เองใช้ Flint (:8090)
  # และการเรียกกลับไปยัง slot เดียวกันแบบ synchronous อาจ deadlock.
  # reuse image เดียวกับ hexstrike-mcp (มี mcp SDK + requests อยู่แล้ว)
  specialist-mcp:
    build:
      context: ..
      dockerfile: pipeline/Dockerfile.hexstrike-mcp
    command: ["python", "/app/pipeline/specialist_mcp_http.py"]
    volumes:
      - ./specialist_mcp_http.py:/app/pipeline/specialist_mcp_http.py:ro
    environment:
      LITELLM_BASE: http://litellm:4000/v1   # เรียกผ่าน gateway ใน compose network
      SPECIALIST_MODEL: cyber-model          # alias ใน litellm-config.yaml (:8091)
      ORCHESTRATOR_MODEL: orchestrator       # alias ใน litellm-config.yaml (:8090)
      ALLOW_ORCHESTRATOR_DELEGATION: "0"      # ป้องกัน self-delegation จาก Flint (:8090)
      CONTROL_PLANE_URL: http://host.docker.internal:8010
      SPECIALIST_TIMEOUT: 1200               # specialist เป็น reasoning 27B/35B ตอบช้า ให้ถึง 20 นาที
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8003
    ports:
      - "127.0.0.1:8003:8003"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - litellm
    restart: unless-stopped

  # ── ชั้นค้นหาเว็บ (MCP over HTTP) ────────────────────────────────────────
  # SearXNG (metasearch self-hosted, ไม่ต้องใช้ API key) + MCP wrapper ให้ Tiel มี
  # tool web_search / fetch_url. การออกเน็ตเกิดในคอนเทนเนอร์พวกนี้ (มีเน็ตเหมือน
  # hexstrike-server ที่โหลด nuclei templates) → Tiel ไม่ต้องมีเน็ตใน sandbox เอง
  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    restart: unless-stopped

  search-mcp:
    build:
      context: ..
      dockerfile: pipeline/Dockerfile.hexstrike-mcp
    command: ["python", "/app/pipeline/search_mcp_http.py"]
    volumes:
      - ./search_mcp_http.py:/app/pipeline/search_mcp_http.py:ro
    environment:
      SEARXNG_BASE: http://searxng:8080   # service DNS ภายใน compose network
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8004
    ports:
      - "127.0.0.1:8004:8004"
    depends_on:
      - searxng
    restart: unless-stopped

  # ── ชั้นสแกนภาพเอกสาร (vFlat — dewarp + enhance ก่อนป้อน vision model) ─────
  # รูปถ่ายเอกสาร/หลักฐานที่เบี้ยว/แสงไม่ดี → รีดให้แบน ลบเงา ทำพื้นขาว คมขึ้น
  # ก่อนส่งให้ vision model (Qwen2.5-VL) อ่าน → OCR แม่นขึ้นมาก
  #   POST /scan  (file=@photo.jpg | doc.pdf)  → image/jpeg หรือ application/pdf
  #   GET  /healthz
  # รัน CPU ล้วน (TFLite + OpenCV, ไม่ต้องใช้ GPU) โมเดลฝังใน image (~7MB)
  # ภายใน compose: http://vflat-scan:8000  |  จาก host: http://localhost:8006
  vflat-scan:
    build:
      context: ./vflat
      dockerfile: Dockerfile
    environment:
      VFLAT_THREADS: ${VFLAT_THREADS:-4}   # 4 บน Mac หลายคอร์ (host คอร์เดียวตั้ง 1)
    ports:
      - "127.0.0.1:8006:8000"
    mem_limit: 1500m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  # ── ชั้น reverse engineering (REA — MCP over HTTP) ───────────────────────
  # ให้ Tiel แกะ binary/APK/firmware/JS/Electron/.NET/WASM/เว็บ ผ่าน REA (rea-agents)
  # REA พูด MCP แบบ stdio → ครอบด้วย supergateway เป็น streamable-HTTP บน :8007
  #   ลงทะเบียนใน HarnessRouter ด้วย url:  http://rea-mcp:8007/mcp
  # image ใหญ่/build นาน (Ghidra+JDK+Chromium+unblob) → profile "full" (opt-in)
  # เป้าหมายที่จะแกะ: วางไฟล์ใน pipeline/rea-targets/ → คอนเทนเนอร์เห็นที่ /work/targets
  rea-mcp:
    profiles: ["full"]
    build:
      context: ./rea
      dockerfile: Dockerfile
    volumes:
      - ./rea-targets:/work/targets
      # รูปหลักฐานสำหรับรายงาน: REA เซฟ screenshot เว็บ (headless Chromium) ลง /evidence
      - ./evidence:/evidence
    ports:
      - "127.0.0.1:8007:8007"
    mem_limit: 4g
    restart: unless-stopped

  # หมายเหตุ: php2shell toolkit (CVE-2026-109618/109619) ไม่ใช่ service แยกแล้ว —
  # register เข้า catalog ของ hexstrike router (ดู hexstrike_mcp_router.py + php2shell_tools.py)
  # → Tiel เรียกผ่าน hexstrike_run("php2shell_*")

  # ── ชั้น screenshot/หลักฐานเว็บ (Playwright + Chromium) — opt-in profile full ──
  #   browser อยู่ container นี้ (ไม่บวม image hexstrike-mcp). router มี tool บางๆ
  #   web_screenshot ที่ POST มาที่ /screenshot → เซฟ PNG ลง /evidence ให้ assemble.py
  #   Tiel เรียกผ่าน hexstrike_run("web_screenshot", {"url": "...", "out": "x.png"})
  shot:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: pipeline/Dockerfile.shot
    volumes:
      - ./shot_server.py:/app/shot_server.py:ro   # แก้ logic ได้ไม่ต้อง rebuild
      - ./evidence:/evidence                       # PNG หลักฐาน → host pipeline/evidence/
    environment:
      SHOT_HOST: 0.0.0.0
      SHOT_PORT: 9000
      OUT_DIR: /evidence
      # describe=true → เรียก vision model (local) ผ่าน litellm อ่านหน้าให้ text model
      LITELLM_BASE: http://litellm:4000/v1
      LITELLM_KEY: ${LITELLM_KEY:-sk-local}
      VISION_MODEL: vision
    extra_hosts:
      - "host.docker.internal:host-gateway"   # ยิง lab บน host ได้ (เหมือน router/server)
    ports:
      - "127.0.0.1:9000:9000"
    depends_on:
      - litellm                               # describe=true ต้องมี litellm (vision)
    restart: unless-stopped

  # ── ชั้นข้อมูลช่องโหว่ (CVE/vuln-intel, MCP over HTTP) — opt-in profile full ──
  #   cve-mcp-server (third-party) ครอบด้วย router (28→3 tool) + กรอง threat-intel ออก
  #   ต้องต่อเน็ตออก (NVD/EPSS/KEV/... สาธารณะ). ใส่ NVD_API_KEY/GITHUB_TOKEN ใน .env ได้ (optional)
  cve-mcp:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: pipeline/Dockerfile.cve-mcp
    volumes:
      - ./cve_mcp_router.py:/app/cve_mcp_router.py:ro   # router mount → แก้ได้ไม่ต้อง rebuild
      - ./node-config.json:/app/node-config.json:ro
    environment:
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8009
      NVD_API_KEY: ${NVD_API_KEY:-}        # optional — เพิ่ม throughput ของ NVD
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}       # optional — เพิ่ม limit ค้น PoC/advisory บน GitHub
    ports:
      - "127.0.0.1:8009:8009"
    restart: unless-stopped

  # ── qwen-code (Unified Orchestrator Harness & Web Studio) ───────────────
  #   รันใน container เพื่อ isolation (คำสั่ง shell/python/tools ทำงานใน sandbox)
  #   เชื่อมต่อ LiteLLM (:4000) และ MCP microservices (:8001-:8009)
  #   Web Studio: http://localhost:3080 (token: malaria-qwen-token)
  qwen-code:
    profiles: ["full"]
    build:
      context: ..
      dockerfile: pipeline/Dockerfile.qwen-code
    ports:
      - "3080:3080"
    environment:
      LITELLM_KEY: ${LITELLM_KEY:-sk-local}
      OPENAI_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_KEY:-sk-local}
      OPENAI_MODEL: flint
      QWEN_SERVER_TOKEN: ${QWEN_SERVER_TOKEN:-malaria-qwen-token}
      QWEN_CODE_ENABLE_AGENT_TEAM: "0"
      HOST_LAN_IP: ${HOST_LAN_IP:-}
    volumes:
      - ./qwen-code/settings.json:/config/settings.json:ro
      - ./qwen-code/agents:/config/agents:ro
      - ./cyber-operator.system.md:/config/cyber-operator.system.md:ro
      - ./qwen-code/entrypoint.sh:/app/entrypoint.sh:ro
      - ./qwen-code/runtime:/host-net:ro
      - ./reporting:/reporting:ro
      - ./reports:/reports
      - ./evidence:/evidence
      - ./playbooks:/playbooks:ro
      - ./skills:/skills:ro
      - ./skills:/workspace/.qwen/skills:ro
      - ./dsh-workspace:/workspace
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - litellm
      - hexstrike-mcp
      - rea-mcp
      - memory-mcp
      - specialist-mcp
      - cve-mcp
      - search-mcp
    restart: unless-stopped

  # ── artex-db (PostgreSQL database for ARTEX) ─────────────────────────────
  artex-db:
    profiles: ["full", "artex"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${ARTEX_PG_USER:-artex}
      POSTGRES_PASSWORD: ${ARTEX_PG_PASSWORD:-artex_secure_password_malaria}
      POSTGRES_DB: ${ARTEX_PG_DB:-artex}
    volumes:
      - artex-pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ARTEX_PG_USER:-artex} -d ${ARTEX_PG_DB:-artex}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ── artex (AI Autonomous Penetration Testing Platform & Graph Dashboard) ──
  #   Full-stack Go backend + Next.js web UI on http://localhost:8787
  #   Features: Exploration Graph, Force-Directed Asset Coverage, Session Tracking,
  #             Traffic Capture, Interception Approvals, Finding Quality Gate, RSI
  artex:
    profiles: ["full", "artex"]
    build:
      context: ./artex
      dockerfile: Dockerfile
      args:
        ARTEX_VERSION: dev
    image: artex:local
    depends_on:
      artex-db:
        condition: service_healthy
      litellm:
        condition: service_started
    environment:
      ARTEX_PG_DSN: postgres://${ARTEX_PG_USER:-artex}:${ARTEX_PG_PASSWORD:-artex_secure_password_malaria}@artex-db:5432/${ARTEX_PG_DB:-artex}?sslmode=disable
      ARTEX_LLM_PROVIDER: openai
      ARTEX_LLM_BASE_URL: http://litellm:4000/v1
      ARTEX_LLM_MODEL: ${ARTEX_LLM_MODEL:-cyber-model}
      OPENAI_API_KEY: ${LITELLM_KEY:-sk-local}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ARTEX_JWT_KEY_DIR: /app/keys
      ARTEX_BIND_ADDR: 0.0.0.0
    ports:
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:8788:8788"
    volumes:
      - ./artex/data:/app/data
      - ./artex/keys:/app/keys
      - ./artex/skills:/app/skills
      - ./evidence:/evidence
      - ./reports:/reports
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  # ── scopesentry-mongodb (ScopeSentry ASM metadata store) ─────────────────
  scopesentry-mongodb:
    profiles: ["full", "scopesentry"]
    image: mongo:7.0.4
    container_name: scopesentry-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${SCOPESENTRY_MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${SCOPESENTRY_MONGO_PASSWORD:-scopesentry_mongo_malaria_2026}
    volumes:
      - scopesentry-mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── scopesentry-redis (ScopeSentry task queue & pub/sub) ─────────────────
  scopesentry-redis:
    profiles: ["full", "scopesentry"]
    image: redis:7.0.11
    container_name: scopesentry-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --requirepass ${SCOPESENTRY_REDIS_PASSWORD:-scopesentry_redis_malaria_2026}
    volumes:
      - scopesentry-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${SCOPESENTRY_REDIS_PASSWORD:-scopesentry_redis_malaria_2026}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── scope-sentry (ASM & Recon platform server + Native MCP endpoint) ─────
  #   Web UI on http://localhost:8082
  #   MCP Endpoint on http://localhost:8082/mcp (or http://scope-sentry:8082/mcp)
  scope-sentry:
    profiles: ["full", "scopesentry"]
    image: autumn27/scopesentry:latest
    container_name: scope-sentry
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      TIMEZONE: Asia/Bangkok
      MONGODB_IP: scopesentry-mongodb
      MONGODB_PORT: 27017
      MONGODB_DATABASE: ScopeSentry
      MONGODB_USER: ${SCOPESENTRY_MONGO_USER:-admin}
      MONGODB_PASSWORD: ${SCOPESENTRY_MONGO_PASSWORD:-scopesentry_mongo_malaria_2026}
      REDIS_IP: scopesentry-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${SCOPESENTRY_REDIS_PASSWORD:-scopesentry_redis_malaria_2026}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8082 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
    depends_on:
      scopesentry-mongodb:
        condition: service_healthy
      scopesentry-redis:
        condition: service_healthy
    volumes:
      - ./scopesentry/data/files:/opt/ScopeSentry/files
      - ./scopesentry/data/images:/opt/ScopeSentry/images
      - ./scopesentry/data/uploads:/opt/ScopeSentry/uploads
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── scopesentry-scan (ScopeSentry distributed scanner worker node) ───────
  scopesentry-scan:
    profiles: ["full", "scopesentry"]
    image: autumn27/scopesentry-scan:latest
    container_name: scopesentry-scan
    restart: unless-stopped
    environment:
      NodeName: node-malaria
      TimeZoneName: Asia/Bangkok
      MONGODB_IP: scopesentry-mongodb
      MONGODB_PORT: 27017
      MONGODB_DATABASE: ScopeSentry
      MONGODB_USER: ${SCOPESENTRY_MONGO_USER:-admin}
      MONGODB_PASSWORD: ${SCOPESENTRY_MONGO_PASSWORD:-scopesentry_mongo_malaria_2026}
      REDIS_IP: scopesentry-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${SCOPESENTRY_REDIS_PASSWORD:-scopesentry_redis_malaria_2026}
    depends_on:
      - scopesentry-redis
      - scope-sentry
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ── unified web host (non-exposed integration service) ────────────────────
  # Canonical normal Next standalone server. The optional static-export branch
  # remains source-declared but is not selected by this service.
  unified-web:
    profiles: ["full", "unified"]
    build:
      context: ..
      dockerfile: pipeline/Dockerfile.unified-web
    environment:
      NODE_ENV: production
      NEXT_EXPORT: "0"
      HOSTNAME: 0.0.0.0
      PORT: 3000
    expose:
      - "3000"
    restart: unless-stopped

  # ── unified namespace gateway (Unified Web Portal on :3000) ───────────────
  # Routes frontend traffic, proxying Qwen (:3080), ARTEX (:8787), ScopeSentry (:8082),
  # and native Observer (:8005) into a single cohesive interface on http://localhost:3000.
  unified-gateway:
    profiles: ["full", "unified"]
    build:
      context: ..
      dockerfile: pipeline/Dockerfile.unified-gateway
    environment:
      NODE_ENV: production
      PORT: 3000
      BIND: 0.0.0.0
      FRONTEND_TARGET: http://unified-web:3000
      QWEN_TARGET: http://qwen-code:3080
      ARTEX_TARGET: http://artex:8787
      SCOPESENTRY_TARGET: http://scope-sentry:8082
      OBSERVER_TARGET: http://host.docker.internal:8005
      OBSERVER_ENABLED: "1"
      OBSERVER_ALLOW_DOCKER_BRIDGE: "1"
    ports:
      - "127.0.0.1:3000:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - unified-web
    restart: unless-stopped

volumes:
  memory-data:
  artex-pgdata:
  scopesentry-mongodb-data:
  scopesentry-redis-data:

