# =============================================================================
# deepseek-harness config layer → ชี้ stack เดิมของเรา (Tiel/LiteLLM + MCP tools)
# -----------------------------------------------------------------------------
# วางไฟล์นี้ที่ $DSH_HOME/profiles/web/cordis.patch.yml (deploy.sh ทำให้)
# cordis.patch เป็น "list ของ config patch ต่อ plugin" — แต่ละ entry ต้องมี 3 ส่วน:
#    id    = ชื่อเล่น (unique ในไฟล์)
#    name  = ชื่อ plugin ที่จะ instantiate  ← ขาดไม่ได้! (ขาด = entry พัง = ทั้งไฟล์ล่ม)
#    config= ค่าของ plugin นั้น
#
# ✅ format ยืนยันจาก entry ที่ UI ของ deepseek-harness สร้างเอง (provider + agent-default-model)
#    และ config-catalog ของ @deepseek-ai/dsh-mcp-client (required: serverName, transport,
#    url, headers, toolCallTimeoutMs, failOnStartupError)
# =============================================================================

# ── (1) model provider → LiteLLM gateway บน host:4000 (Tiel / vision / nim) ──
#   ⚠️ สำคัญ: ทุก entry ต้องมี `name:` = ชื่อ plugin ที่จะ instantiate
#      (ถ้าขาด → Cordis ไม่รู้ว่าจะโหลด plugin ไหน → entry พัง → ทั้งไฟล์โหลดไม่ผ่าน
#       = provider + MCP หายหมด ทั้งที่ MCP ถูก format แล้ว) — ยืนยันจาก entry ที่ UI สร้าง
- id: llm-litellm-local
  name: "@deepseek-ai/dsh-llm-pi-ai"         # ← plugin ของ LLM provider (custom OpenAI-compatible)
  config:
    providers:
      litellm-local:
        displayName: LiteLLM (local)
        apiKeyEnv: LITELLM_KEY              # ตั้ง env LITELLM_KEY=sk-local (llama ไม่เช็ค แต่ field ต้องมี)
        api: openai-completions
        baseURL: http://localhost:4000/v1   # = LiteLLM ที่ publish ออก host (127.0.0.1:4000)
        models:
          - id: cybermodel                  # Tiel (orchestrator) — งาน sensitive/หลักฐาน
            name: Cyber-Tiel
          - id: vision                       # Qwen2.5-VL (อ่านภาพ)
            name: Vision (Qwen2.5-VL)
          - id: nim                          # GLM cloud — ⚠️ งาน non-sensitive เท่านั้น
            name: NIM (GLM cloud)
        compat:
          supportsDeveloperRole: false       # llama.cpp มักต้องตั้ง (ถ้า request โดนปฏิเสธทั้งที่ url/key ถูก)
          maxTokensField: max_tokens

# ── (1b) ตั้ง provider/model ดีฟอลต์ของ agent = Tiel (cybermodel) ──────────────
#   ไม่ใส่ก็ได้ (เลือกใน UI เองได้) แต่ใส่ไว้ให้ repo config ครบในตัว (reproducible)
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: litellm-local                  # ต้องตรงกับ key ใน providers: ด้านบน
    model: cybermodel

# ── (2) MCP tools → HexStrike router + REA ──────────────────────────────────
#   ✅ ครบตาม config-catalog ของ @deepseek-ai/dsh-mcp-client (streamable-http):
#      required: serverName, transport, url, headers, toolCallTimeoutMs, failOnStartupError
#      "1 entry ต่อ 1 server" (ไม่ใช่ servers: map). tool โผล่แบบ mcp__<serverName>__<toolName>
#   ⚠️ เคยพลาด: ขาด headers + toolCallTimeoutMs (required) → schema ไม่ผ่าน → plugin ไม่โหลด
#   ⚠️ url ต้องเป็น localhost (harness รันบน host) ไม่ใช่ชื่อ service ภายใน docker
- id: mcp-hexstrike
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: hexstrike                    # → tool: mcp__hexstrike__* (search/describe/run)
    transport: streamable-http
    url: http://localhost:8001/mcp
    headers: {}                              # required (ไม่มี auth สำหรับ local → ว่าง)
    toolCallTimeoutMs: 300000                # required — timeout ต่อ 1 tool call (scan นานได้ 5 นาที)
    failOnStartupError: false                # ต่อไม่ติด = harness ยังขึ้น แต่ไม่มี tool (ดู log)

- id: mcp-rea
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: rea                          # → tool: mcp__rea__* (ต้องเปิด --profile full)
    transport: streamable-http
    url: http://localhost:8007/mcp
    headers: {}                              # required
    toolCallTimeoutMs: 300000                # required — RE/decompile ใช้เวลานาน → 5 นาที
    failOnStartupError: false
#   หมายเหตุ: vision/specialist เราเรียกผ่าน bash heredoc → localhost:4000 (ไม่ใช่ MCP)
#   deepseek-harness มี bash/command tool อยู่แล้ว → เรียกแบบเดิมได้ ไม่ต้องลง MCP
