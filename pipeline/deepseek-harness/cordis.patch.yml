# =============================================================================
# deepseek-harness config layer — AUTO-SYNCED BY n8n BACKEND BRIDGE
# =============================================================================

- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      litellm-local:
        displayName: LiteLLM (local)
        apiKeyEnv: LITELLM_KEY
        api: openai-completions
        baseURL: http://litellm:4000/v1
        models:
          - id: orchestrator
            name: "Orchestrator (Coding & Synthesis)"
            limit:
              context: 16384
              output: 8192
          - id: cyber-model
            name: "Cyber-Model (Cyber Security)"
            input: [text, image]
            limit:
              context: 16384
              output: 8192
          - id: vision
            name: "Vision (Qwen2.5-VL)"
            input: [text, image]
            limit:
              context: 16384
              output: 4096
          - id: nim
            name: "NIM (Nemotron VL Cloud)"
            input: [text, image]
            limit:
              context: 131072
              output: 8192
          - id: or-glm
            name: "OpenRouter GLM-5.3 (Cloud)"
            limit:
              context: 131072
              output: 8192
        compat:
          supportsDeveloperRole: false
          maxTokensField: max_tokens

- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: litellm-local
    model: cyber-model
